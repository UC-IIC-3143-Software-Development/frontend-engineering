name: Rendimiento

on:
  pull_request:
  push:
    branches: [main]

jobs:
  presupuestos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_RELEASE: ${{ github.sha }}

      - name: Presupuesto de JS (size-limit)
        run: npm run size

      # Corre aunque falle size-limit: el PR muestra ambos resultados
      - name: Lighthouse CI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lhci
        # Para tener un enlace público al reporte, usen esta línea:
        # run: npx lhci autorun --upload.target=temporary-public-storage

      - name: Guardar reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-lighthouse
          path: .lighthouseci/
